name: Release checks

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version and source
    # The cards runtime is currently Windows-only.
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # Match the documented UTF-8 terminal contract, including child processes.
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # hatch-vcs 从 git tag 推导版本；浅克隆看不到 tag，版本会退回 fallback。
          fetch-depth: 0
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.21"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Verify installed version and tag
        # 版本由 hatch-vcs 从 git tag 推导，`uv version` 在 dynamic version 下不可用；
        # 这里以安装后的包版本为准，并校验 tag 与之一致。
        run: |
          $installedVersion = uv run --no-sync python -c "from importlib.metadata import version; print(version('hydrolitagent'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $installedVersion) { throw "Could not read the installed version" }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$installedVersion") {
            throw "Tag $env:GITHUB_REF_NAME differs from v$installedVersion"
          }
          Write-Output "Verified version: $installedVersion"
      - name: Run test suite
        env:
          # Runner context is available here, not in job-level env.
          # Avoid RUNNER~1 aliases in temporary path assertions.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        # Zotero integration tests keep their own availability/sample gates.
        # A skip is reported by pytest; failures are never filtered out.
        run: uv run --no-sync pytest -rs
      - name: Check CLI entry
        run: uv run --no-sync hydrolitagent cards --help
      - name: Validate offline example
        run: uv run --no-sync python scripts/paper_validate.py --draft hydrolitagent/cards/assets/examples/subject-card-validation/draft.json --paper-input hydrolitagent/cards/assets/examples/subject-card-validation/paper-input.json --report-dir outputs/release-validation
      - name: Build documentation in strict mode
        run: uv run --no-sync mkdocs build --strict

# This workflow validates source releases only. It does not upload to PyPI,
# create release tags, or publish a GitHub Release without a maintainer.
