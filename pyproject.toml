[project]
name = "hydrolitagent"
version = "0.1.0"
description = "Literature knowledge base toolkit for hydrology research."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["graphifyy", "openai"]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[project.scripts]
hydrolitagent = "hydrolitagent.cli:main"

[tool.setuptools.packages.find]
include = ["hydrolitagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
