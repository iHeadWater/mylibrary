[build-system]
# 必须显式声明：缺省时 uv 视本工程为"未打包"（virtual），
# project.scripts 的入口点不会被安装，`uv run hydrolitagent` 将不可用。
# hatch-vcs 让版本跟随 git tag：发版只需打标签，不必手改版本号。
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "hydrolitagent"
dynamic = ["version"]
description = "Literature knowledge base toolkit for hydrology research."
readme = "README.md"
license = { text = "AGPL-3.0" }
# docker/Dockerfile 使用 python:3.12-slim，满足此范围。
requires-python = ">=3.12,<3.15"
dependencies = [
  "graphifyy",
  "openai",
  "mcp>=2.0.0",
  "httpx>=0.27.0",
  "pyzotero>=1.13.0",
  "python-dotenv>=1.0",
  "markdown>=3.5",
  "requests>=2.31",
  "pillow>=10.0",
  # 原 hydro-platform workspace 成员的依赖，随包合并并入根包。
  # 精确 pin 是继承来的（来自旧 hydro-platform 的 `pdf-direct` extra），不是为合并做的决定：
  # PDF 直读路径用它解析页数/文本。代价是 Dependabot 对 `==` 只报不修，每次安全公告都得手工 bump。
  "pypdf==6.21.2",
  # 付费墙出版商（ScienceDirect / Wiley / AGU / Nature / Springer）的下载路径靠它。
  # 必须是核心依赖而非 extra：它是幽灵依赖过一次——只经 notebooklm[browser] 间接进入 lock，
  # 默认不装，任何一次 `uv sync` 都会把手装的那份剪掉，download_paper.py 的浏览器分支随之静默失效。
  # 浏览器二进制不在 uv 管理范围内，换机器后仍需跑一次 `uv run playwright install chromium`。
  "playwright>=1.62",
  # PDF→Markdown 转换（版面、页锚点、提图）。AGPL-3.0 与本项目许可兼容。
  # 选 PyMuPDF 而非 pymupdf4llm：需要自己控制页锚点、reading-canary 与提图坐标。
  # 上限 <2：pymupdf 2.x 把 pymupdf4llm / onnxruntime 变成硬依赖，本任务不需要。
  "pymupdf>=1.24,<2",
]

[project.optional-dependencies]
notebooklm = [
  "notebooklm-py[browser]>=0.5.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
  "pytest-cov>=7.1.0",
]

[project.scripts]
hydrolitagent = "hydrolitagent.cli:main"

[tool.hatch.version]
# 版本来自 git tag（vX.Y.Z）。拿不到任何 tag 时（例如源码 tarball）退回此值。
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
# 不在版本号后面附 +g<sha>：wheel 文件名要干净，方便对照 tag。
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["hydrolitagent"]
# hatch 默认收录包目录下的所有文件，因此文献卡与主题卡的资产
# （templates / prompts / schemas / examples / config）随包分发，无需额外声明。

[tool.pytest.ini_options]
# 两套测试已并为一套：hydrolitagent 的与平台的一起放在仓库根 tests/。
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
