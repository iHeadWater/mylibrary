[project]
name = "hydrolitagent"
version = "0.1.0"
description = "Literature knowledge base toolkit for hydrology research."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "graphifyy",
  "openai",
  "mcp>=2.0.0",
  "httpx>=0.27.0",
  "pyzotero>=1.13.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
]

[project.scripts]
hydrolitagent = "hydrolitagent.cli:main"

[tool.setuptools.packages.find]
include = ["hydrolitagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
