interface:
  display_name: "水利科研证据卡"
  short_description: "把 Zotero 文献写成深入、可读、可核验的科研证据卡"
  brand_color: "#176B87"
  default_prompt: "Use $hydrology-evidence-cards to read a selected Zotero source and write a source-grounded evidence card whose visible scientific narrative reconstructs the research question, actual data, method and validation chain, decisive results, contribution and conclusion boundary. For substantive full/partial-text sources, require at least 5,000 non-whitespace visible characters at L1 or 6,000 at L2/L3; never count frontmatter, links, bibliography, calibration or collapsed machine audit, and never pad a source-limited record."
policy:
  allow_implicit_invocation: true
