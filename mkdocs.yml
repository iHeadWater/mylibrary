site_name: Hydro AI Papers
site_description: 水利科研的两条能力线 —— 入库侧（Zotero 工具、精读、知识图谱）与消费侧（证据包、主题池）
repo_url: https://github.com/OuyangWenyu/mylibrary
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.expand
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至暗色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至亮色模式

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            show_root_heading: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - admonition
  - footnotes
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 快速开始:
      - 安装配置: getting-started/installation.md
      - 5 分钟上手: getting-started/quickstart.md
  - 用户指南:
      - 总览: user-guide/index.md
      - MCP Server 工具: user-guide/mcp-tools.md
      - 论文入库流水线: user-guide/paper-pipeline.md
      - 论文 PDF 下载: user-guide/download-pdf.md
      - Zotero 入库（linked_file）: user-guide/zotero-sync.md
      - Zotero → NotebookLM 简报: user-guide/zotero-notebooklm.md
      - 文献深度处理: user-guide/literature.md
      - Zotero 配置参考: user-guide/config.md
  - 科研知识平台:
      - 概述: hydro-platform/index.md
      - 上手与运行:
