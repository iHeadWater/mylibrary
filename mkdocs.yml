site_name: Hydro AI Papers
site_description: 水利科研的入库与消费两侧 —— 论文下载与 Zotero 入库；读库、精读、主题、知识图谱、公众号/播客；以及长期知识资产（证据包、主题池）
repo_url: https://github.com/iHeadWater/mylibrary
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.expand
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至暗色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至亮色模式

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            show_root_heading: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - admonition
  - footnotes
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 快速开始:
      - 安装配置: getting-started/installation.md
      - 5 分钟上手: getting-started/quickstart.md
  - 用户指南:
