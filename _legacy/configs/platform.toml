exclude_sheet_keywords = ["项目总表", "JCR", "标注形式"]
title_columns = [2]
summary_columns = [3]
people_columns = [4, 5, 6, 7, 8, 9, 10, 11]
venue_columns = [12, 13, 14]
identifier_columns = [23]

[record_types.paper.time]
start_date = "2025-06-01"
