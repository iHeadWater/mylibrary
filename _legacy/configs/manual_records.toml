[supplemental_records.video_rainfall_ciega]
kind = "paper"
title = "Video-Based Rainfall Opportunistic Sensing in Hydrology: A Light-weight Machine Learning Approach"
people = ["李昱", "金勇成"]
status = "在审"
track = "监测"
summary = "如何从视频动态中快速、准确且鲁棒地识别与降雨信息相关的雨痕特征仍是具有挑战的关键问题；该研究提出耦合图像增强与逐步聚合网络（CIEGA-NET）的轻量级机器学习方法，用以解决视频测雨精度和效率之间的权衡问题。依托轻量化网络设计和高运行效率，CIEGA-NET 有望为低成本、高密度降雨监测提供可行方案。"
decision_reason = "用户补充李昱、金勇成等在审论文"
source_note = "用户于 2026-05-20 补充"
added_at = "2026-05-20"

[supplemental_records.wang_ze_wrr_sofi]
kind = "paper"
title = "王泽 WRR 视觉水位解译论文（题名待确认）"
people = ["王泽"]
date = "2025-01-01"
status = "已发表"
venue_or_type = "Water Resources Research"
identifier = "10.1029/2025WR042686"
track = "监测"
summary = "该框架首先利用 SAM（Segment Anything Model）视觉基础分割模型对河道图像中的水体区域进行高效识别与分割；进而计算能够表征可见水面范围动态变化的特征指标 SOFI（Static Observer Flooding Index）；最终构建 SOFI 与真实水位之间的轻量回归模型，实现水位解译。通过将图像与水位之间复杂的高维映射转化为具有物理可解释性的低维特征回归问题，该框架有效降低了模型对大规模训练样本的依赖。"
evidence_links = ["https://agupubs.onlinelibrary.wiley.com/doi/full/10.1029/2025WR042686"]
